# ASK Ubuntu Mini – configuration
# Location: ~/.config/ask-ubuntu-mini/config.toml

# Ollama servers. The first available server is selected.
# NOTE: provide only the base URL (http://host:port), NOT the /api/chat path.
ollama_urls = [
    "http://192.168.1.103:11434",
    "http://localhost:11434",
]

# Default model
model = "llama3.1:8b"

# Generation temperature (0.0 = deterministic, 1.0 = creative)
temperature = 0.0

# Context length in tokens
num_ctx = 8192
num_predict = 300
repeat_penalty = 1.3
repeat_last_n = 256

# Maximum number of consecutive tool calls before interruption
max_iterations = 5

# User interface language override (eng, fin, sve, ...)
# lang_code = "fin"

# SHL machine translation
m_translation_enabled = "true"

# Stop sequences: stop generation when these strings are encountered
stop = [
    "```json",
    "```JSON",
    "Here's how",
    "Here is how",
    "here's how",
    "here is how",
    "However, to provide",
    "However, to answer",
    "To provide a JSON",
    "Based on the given functions",
    "based on the given functions",
]

# NOTE: system_prompt is now located in ~/.config/ask-ubuntu-mini/system_prompts/:
#   - core.toml      core prompt (same for all languages)
#   - fi.toml        language-specific addition (automatic)
# config.toml's system_prompt is only used as a fallback if the directory does not exist.

config_version = 1
ollama_health_cache_ttl = 30
ollama_health_timeout = 1.5
ollama_health_backoff = [2, 4, 8, 16, 30, 60]
ollama_chat_timeout = 120
